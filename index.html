<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIKI Reader</title>
<style>
body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(720px,92vw);background:#151923;border:1px solid #2b3140;border-radius:20px;padding:24px}button{padding:13px 18px;border:0;border-radius:12px;font-weight:700;cursor:pointer;margin:5px}#connect{background:white}#led{background:#5b67ff;color:white}#led:disabled{opacity:.4}.status{margin:12px 5px;padding:12px;background:#0e1118;border-radius:10px}canvas{width:100%;height:300px;background:#080a0f;border-radius:14px}label{display:block;margin:12px 5px;color:#b5bdcc}
</style></head><body><main class="card">
<h1>TRIKI Reader</h1><p>Реальное чтение движения Triki через Bluetooth.</p>
<button id="connect">Подключить Triki</button><button id="led" disabled>Проверить LED</button>
<label><input id="all" type="checkbox"> Accept all services</label>
<div id="status" class="status">Не подключено</div><canvas id="cv" width="900" height="360"></canvas>
<script>
const S='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e',LED='6e400004-b5a3-f393-e0a9-e50e24dcca9e';
let rx,tx,led,buf=new Uint8Array(),v=[0,0,0,0,0,0],n=0;
const st=t=>document.querySelector('#status').textContent=t;
function parse(d){let a=new Uint8Array(buf.length+d.byteLength);a.set(buf);a.set(new Uint8Array(d),buf.length);buf=a;
while(buf.length>=14){let p=-1;for(let i=0;i<buf.length-1;i++)if(buf[i]==34&&buf[i+1]<=15){p=i;break}if(p<0){buf=buf[buf.length-1]==34?buf.slice(-1):new Uint8Array();return}if(p)buf=buf.slice(p);if(buf.length<14)return;
let f=buf.slice(0,14);buf=buf.slice(14);v=Array.from({length:6},(_,i)=>new DataView(f.buffer,f.byteOffset+2+i*2,2).getInt16(0,true));n++;draw()}}
function draw(){let c=document.querySelector('#cv'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.save();x.translate(w/2,h/2);let a=Math.max(-1,Math.min(1,v[3]/2050)),b=Math.max(-1,Math.min(1,v[4]/2050)),r=Math.max(-1,Math.min(1,v[0]/800));x.rotate(r*.7);x.fillStyle='#2b3140';x.beginPath();x.roundRect(-180+a*70,-65+b*45,360,130,65);x.fill();x.restore();x.fillStyle='#aeb6c8';x.font='18px monospace';x.fillText('samples: '+n,20,28);x.fillText('gyro: '+v.slice(0,3).join(' '),20,55);x.fillText('accel: '+v.slice(3).join(' '),20,82)}
async function connect(){try{if(!navigator.bluetooth)throw Error('Web Bluetooth недоступен. Открой сайт в Chrome/Edge по HTTPS.');st('Выбор Triki…');let d=await navigator.bluetooth.requestDevice(document.querySelector('#all').checked?{acceptAllDevices:true,optionalServices:[S]}:{filters:[{services:[S]}]});let g=await d.gatt.connect(),s=await g.getPrimaryService(S);rx=await s.getCharacteristic(RX);tx=await s.getCharacteristic(TX);led=await s.getCharacteristic(LED);await tx.startNotifications();tx.addEventListener('characteristicvaluechanged',e=>parse(e.target.value));await rx.writeValue(new Uint8Array([32,16,0,52,0,52,0,3]));document.querySelector('#led').disabled=false;st('Подключено: '+(d.name||'Triki'))}catch(e){st('Ошибка: '+e.message)}}
document.querySelector('#connect').onclick=connect;
const b=document.querySelector('#led');b.onpointerdown=()=>led&&led.writeValue(new Uint8Array([1]));b.onpointerup=()=>led&&led.writeValue(new Uint8Array([0]));b.onpointercancel=b.onpointerleave=b.onpointerup;draw();
</script></main></body></html>
