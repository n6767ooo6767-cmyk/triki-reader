<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIKI Reader</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#18251d 0,#090c0b 42%,#050606 100%);color:#f4f7f4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}
.card{width:min(900px,94vw);padding:24px;border:1px solid #28312b;border-radius:24px;background:rgba(13,17,15,.92);box-shadow:0 24px 80px #0008}
h1{margin:0 0 4px;font-size:30px}p{margin:0 0 16px;color:#9da99f}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{padding:13px 18px;border:0;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px}
#connect{background:#f4f6f4;color:#101410}
#led{background:#11a64a;color:#fff}#led:disabled{opacity:.35;cursor:not-allowed}
label{margin-left:4px;color:#aeb9b0;font-size:14px}
.status{margin:14px 0;padding:11px 13px;background:#090d0b;border:1px solid #222b25;border-radius:12px;color:#cbd5cd}
.stage{height:390px;border-radius:20px;background:radial-gradient(circle,#17231b 0,#0a0e0c 65%);display:grid;place-items:center;overflow:hidden;position:relative}
.stage:after{content:"";position:absolute;width:300px;height:70px;border-radius:50%;background:#0008;filter:blur(18px);bottom:45px}
.scene{width:280px;height:280px;perspective:800px;display:grid;place-items:center;position:relative;z-index:1}
.triki{width:238px;height:238px;position:relative;transform-style:preserve-3d;transition:transform .035s linear}
.cap{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d}.triki:before{content:"";position:absolute;inset:7px;border-radius:50%;background:linear-gradient(90deg,#151816,#626862 48%,#202420);transform:translateZ(-11px);box-shadow:0 8px 16px #000b}.triki:after{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;border-radius:50%;border:8px solid #252a26;transform:translateZ(-6px);box-shadow:inset 0 0 10px #000}
.rim{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,#3a3f3b 0 6deg,#171a18 6deg 12deg);box-shadow:0 7px 15px #000a,0 0 0 4px #090b0a}
.green{position:absolute;inset:9px;border-radius:40% 40% 46% 46%/44% 44% 48% 48%;background:radial-gradient(circle at 35% 30%,#83f19b33 0 5%,#21b94d22 22%,#0b2012 72%);border:2px solid #5eea7a66;box-shadow:inset 0 0 25px #2bce5b33}
.face{position:absolute;inset:17px;border-radius:38% 38% 44% 44%/42% 42% 46% 46%;background:linear-gradient(145deg,#d5d8d5,#7b817d 44%,#454945 72%,#b7bbb7);box-shadow:inset 0 2px 3px #fff9,inset 0 -7px 14px #0007,0 2px 3px #000b;display:grid;place-items:center}
.logo{font-weight:1000;letter-spacing:-2px;font-size:34px;color:#e8ebe8;text-shadow:0 2px 2px #0008;transform:translateZ(10px)}
.logo b{color:#21a94a}.ledDot{position:absolute;top:43px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#26302a;box-shadow:inset 0 2px 3px #0008;transition:.1s}.ledDot.on{background:#baffc5;box-shadow:0 0 8px #22ff55,0 0 28px #20db55}
.centerMark{position:absolute;width:7px;height:7px;border-radius:50%;background:#262a27;box-shadow:0 1px 2px #fff8}
.info{position:absolute;left:16px;bottom:14px;color:#78857b;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<main class="card">
<h1>TRIKI Reader</h1>
<p>Подключи настоящий Triki — виртуальный капсюль повторяет его наклон и вращение.</p>
<div class="controls">
<button id="connect">Подключить Triki</button>
<button id="led" disabled>Проверить</button>
<label><input id="all" type="checkbox"> Accept all services</label>
</div>
<div id="status" class="status">Не подключено</div>
<div class="stage">
  <div class="scene"><div id="triki" class="triki">
    <div class="cap rim"></div><div class="cap green"></div>
    <div class="cap face"><div class="logo"><span>Tr</span><b>i</b><span>ki</span></div><div id="ledDot" class="ledDot"></div><div class="centerMark"></div></div>
  </div></div>
  <div id="info" class="info">gyro: 0 0 0 · accel: 0 0 0</div>
</div>
<script>
const S='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e',LED='6e400004-b5a3-f393-e0a9-e50e24dcca9e';
const MOTION=new Uint8Array([32,16,0,52,0,52,0,3]), LED_ON=new Uint8Array([1]), LED_OFF=new Uint8Array([0]);
let tx,rx,led,buf=new Uint8Array(),device, reconnectTimer=null, connecting=false, reconnectAttempts=0;
let vals=[0,0,0,0,0,0],samples=0,lastT=0;
let rot={x:0,y:0,z:0};
const RESTING_X=70; // Triki лежит: его плоскость почти горизонтальна относительно сцены.
let yaw=0;
const st=t=>document.querySelector('#status').textContent=t;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function parse(d){
  const incoming=new Uint8Array(d.byteLength); incoming.set(new Uint8Array(d.buffer,d.byteOffset,d.byteLength));
  const joined=new Uint8Array(buf.length+incoming.length);joined.set(buf);joined.set(incoming,buf.length);buf=joined;
  while(buf.length>=14){
    let p=-1;
    for(let i=0;i<buf.length-1;i++) if(buf[i]===0x22 && buf[i+1]<=0x0f){p=i;break}
    if(p<0){buf=buf[buf.length-1]===0x22?buf.slice(-1):new Uint8Array();return}
    if(p)buf=buf.slice(p);
    if(buf.length<14)return;
    const f=buf.slice(0,14);buf=buf.slice(14);
    const dv=new DataView(f.buffer,f.byteOffset,f.byteLength);
    vals=[];
    for(let i=0;i<6;i++) vals.push(dv.getInt16(2+i*2,true));
    updateMotion();
    samples++;
  }
}

function updateMotion(){
  const now=performance.now();
  const dt=lastT?clamp((now-lastT)/1000,.005,.08):.019;
  lastT=now;
  // Gyroscope: integrate all three axes so physical rotation is visible.
  // The scale is intentionally conservative for the small Triki sensor.
  yaw += vals[2]*dt*0.00045;

  // Accelerometer slowly corrects pitch/roll drift when the device is tilted.
  const ax=vals[3], ay=vals[4], az=vals[5];
  const roll=Math.atan2(ay,Math.sqrt(ax*ax+az*az))*180/Math.PI;
  const pitch=Math.atan2(-ax,Math.sqrt(ay*ay+az*az))*180/Math.PI;
  // Абсолютный наклон берём из гравитации, поэтому положение не зависит от того,
  // сколько времени Triki вращали: плоско = лежит, около 90° = стоит на ребре.
  rot.x = RESTING_X - pitch;
  rot.y = roll;
  rot.z = yaw;
  document.querySelector('#triki').style.transform='rotateX('+rot.x.toFixed(2)+'deg) rotateY('+rot.y.toFixed(2)+'deg) rotateZ('+rot.z.toFixed(2)+'deg)';
  document.querySelector('#info').textContent='gyro: '+vals.slice(0,3).join(' ')+' · accel: '+vals.slice(3).join(' ')+' · packets: '+samples;
}

async function setLed(on){
  if(!led)return;
  try{await led.writeValue(on?LED_ON:LED_OFF);document.querySelector('#ledDot').classList.toggle('on',on)}catch(e){st('LED: '+e.message)}
}

async function setupConnection(){
  if(!device||!device.gatt) throw Error('Triki не выбран');
  if(!device.gatt.connected){
    st('Переподключение к Triki…');
    await device.gatt.connect();
  }
  const s=await device.gatt.getPrimaryService(S);
  rx=await s.getCharacteristic(RX);
  tx=await s.getCharacteristic(TX);
  led=await s.getCharacteristic(LED);
  try{await tx.startNotifications()}catch(e){}
  tx.addEventListener('characteristicvaluechanged',e=>parse(e.target.value));
  buf=new Uint8Array();
  lastT=0;
  await rx.writeValue(MOTION);
  document.querySelector('#led').disabled=false;
  reconnectAttempts=0;
  st('Подключено: '+(device.name||'Triki'));
}

function scheduleReconnect(){
  if(!device||reconnectTimer||connecting)return;
  const delay=Math.min(1000*Math.pow(1,reconnectAttempts),5000);
  reconnectTimer=setTimeout(async()=>{
    reconnectTimer=null;
    if(!device)return;
    try{
      connecting=true;
      await setupConnection();
    }catch(e){
      reconnectAttempts++;
      document.querySelector('#led').disabled=true;
      st('Triki отключён — переподключение…');
      scheduleReconnect();
    }finally{connecting=false}
  },delay);
}

async function connect(){
  try{
    if(!navigator.bluetooth) throw Error('Web Bluetooth недоступен. Открой сайт через HTTPS в Chrome/Edge.');
    if(connecting)return;
    connecting=true;
    st('Выбор Triki…');
    const opts=document.querySelector('#all').checked
      ? {acceptAllDevices:true,optionalServices:[S]}
      : {filters:[{services:[S]}],optionalServices:[S]};
    device=await navigator.bluetooth.requestDevice(opts);
    device.addEventListener('gattserverdisconnected',()=>{
      document.querySelector('#led').disabled=true;
      if(!connecting) scheduleReconnect();
      st('Triki отключён — переподключение…');
    });
    await setupConnection();
  }catch(e){
    document.querySelector('#led').disabled=true;
    st('Ошибка: '+e.message);
  }finally{connecting=false}
}

document.querySelector('#connect').onclick=connect;
const b=document.querySelector('#led');
b.onpointerdown=()=>setLed(true);
b.onpointerup=()=>setLed(false);
b.onpointercancel=()=>setLed(false);
b.onpointerleave=()=>setLed(false);
drawInitial();

function drawInitial(){
  document.querySelector('#triki').style.transform='rotateX('+RESTING_X+'deg) rotateY(0deg) rotateZ(0deg)';
}
</script>
</main>
</body>
</html>
